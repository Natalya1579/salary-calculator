{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Все профессии</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        {% for profession in professions %}
        <a href="/profession/{{ profession.id }}" style="padding: 12px; background: white; border-radius: 8px; text-decoration: none; color: #2c3e50; border: 1px solid #ddd;">
            {{ profession.title }}
        </a>
        {% else %}
        <p>Пока нет профессий. Добавьте первую зарплату</p>
        {% endfor %}
    </div>
</div>
<div class="card">
    <div>
        <a href="/add-salary" class="btn">Добавить зарплату</a>
    </div>
</div>
{% endblock %}
